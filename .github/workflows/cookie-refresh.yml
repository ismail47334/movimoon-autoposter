name: MoviMoon Auto Cookie Refresh Bot - V40 OPTION 2

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  refresh-cookies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright + Deps
        run: |
          pip install playwright requests PyNaCl
          playwright install chromium
          playwright install-deps chromium
          sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Run Cookie Refresher Bot
        env:
          BURNER_EMAIL: ${{ secrets.BURNER_EMAIL }}
          BURNER_PASSWORD: ${{ secrets.BURNER_PASSWORD }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python cookie_refresher.py
          ls -lh cookies.txt || echo "no cookies"
          echo "Cookies size: $(wc -c < cookies.txt) bytes"

      - name: Commit refresh log
        run: |
          git config --global user.name 'Cookie Bot'
          git config --global user.email 'cookie@movimoon.online'
          echo "Cookie refresh completed at $(date)" > last_cookie_refresh.txt
          git add last_cookie_refresh.txt || true
          git diff --staged --quiet || git commit -m "Auto cookie refresh [skip ci]" || true
          git push || echo "No push"

      - name: Upload cookies as artifact
        uses: actions/upload-artifact@v4
        with:
          name: cookies-txt
          path: cookies.txt
          retention-days: 7
