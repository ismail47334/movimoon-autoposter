name: MoviMoon V47 - HOTFIX - History Bug Fixed

on:
  schedule:
    - cron: '0 4 * * *'
    - cron: '0 9 * * *'
    - cron: '0 14 * * *'
  workflow_dispatch:

jobs:
  post-videos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg + Node + yt-dlp + POT - V44 FIXED
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-dejavu
          curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
          sudo apt-get install -y nodejs
          node --version
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt --upgrade
          python -m pip install -U yt-dlp[default] --upgrade
          python -m pip install -U requests --upgrade
          python -m yt_dlp --version

      - name: Clean old cookies - V44 NO FAKE COOKIE
        run: |
          rm -f cookies.txt youtube_oauth_token.json
          rm -rf output
          rm -f voice_text.txt temp_gemini_tts_runner.py gemini_tts_output.mp3 voice_final.wav
          echo "V44 FIXED: History bug fixed + REST TTS + No fake cookies"
          ls -lh

      - name: Run MoviMoon V44 HOTFIX
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_GROUP_ID: ${{ secrets.FB_GROUP_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
          YOUTUBE_PROXY: ${{ secrets.YOUTUBE_PROXY }}
          YOUTUBE_PROXY_LIST: ${{ secrets.YOUTUBE_PROXY_LIST }}
        run: |
          python -u movimoon-video-autoposter.py

      - name: Commit history
        if: always()
        run: |
          git config --global user.name 'MoviMoon Bot'
          git config --global user.email 'bot@movimoon.online'
          git add posted_history.json || true
          git diff --staged --quiet || git commit -m "Update history V44 HOTFIX [skip ci]" || true
          git push || true
