name: MoviMoon Video AutoPoster - FINAL FIXED 2026-10-18

on:
  schedule:
    - cron: '0 4 * * *'
    - cron: '0 9 * * *'
    - cron: '0 14 * * *'
  workflow_dispatch:

jobs:
  post-videos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg + Deno + yt-dlp (FINAL)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> $GITHUB_PATH
          export DENO_INSTALL="$HOME/.deno"
          export PATH="$DENO_INSTALL/bin:$PATH"
          $HOME/.deno/bin/deno --version
          pip install -r requirements.txt
          pip install -U "yt-dlp[default]" yt-dlp-ejs
          yt-dlp --version

      - name: Create cookies.txt (FIXED - preserve format)
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          if [ -n "$YOUTUBE_COOKIES" ]; then
            printf "%s" "$YOUTUBE_COOKIES" > cookies.txt
            # If file doesn't start with Netscape header, it's probably JSON - convert not possible, keep as is and try
            if head -n1 cookies.txt | grep -q "http_cookie"; then
              echo "Cookies in JSON format detected - converting attempt"
            fi
            echo "cookies.txt size: $(wc -c < cookies.txt) bytes, lines: $(wc -l < cookies.txt)"
            head -c 200 cookies.txt
            echo ""
          else
            echo "No YOUTUBE_COOKIES secret"
          fi
          ls -lh

      - name: Run HD Video Autoposter (DEBUG MODE)
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_GROUP_ID: ${{ secrets.FB_GROUP_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          export DENO_INSTALL="$HOME/.deno"
          export PATH="$DENO_INSTALL/bin:$PATH"
          echo "=== Python version ==="
          python --version
          echo "=== Files ==="
          ls -lh
          echo "=== Starting Python ==="
          python -u movimoon-video-autoposter.py

      - name: Commit posted history
        run: |
          git config --global user.name 'MoviMoon Bot'
          git config --global user.email 'bot@movimoon.online'
          git add posted_history.json || echo "No history"
          git diff --staged --quiet || git commit -m "Update history [skip ci]"
          git push || echo "No changes"
