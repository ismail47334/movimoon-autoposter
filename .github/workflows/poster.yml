name: MoviMoon Video AutoPoster - FIXED 2026

on:
  schedule:
    - cron: '0 4 * * *'
    - cron: '0 9 * * *'
    - cron: '0 14 * * *'
  workflow_dispatch:

jobs:
  post-videos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg + Deno + yt-dlp (FIXED)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          
          # Install Deno - Required for PO Token bypass
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> $GITHUB_PATH
          export DENO_INSTALL="$HOME/.deno"
          export PATH="$DENO_INSTALL/bin:$PATH"
          $HOME/.deno/bin/deno --version
          
          # Install with default + ejs (critical for bot bypass)
          pip install -r requirements.txt
          pip install -U "yt-dlp[default]"
          pip install -U yt-dlp-ejs
          yt-dlp --version

      - name: Create cookies.txt + Verify
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          if [ -n "$YOUTUBE_COOKIES" ]; then
            echo "$YOUTUBE_COOKIES" > cookies.txt
            # Ensure Netscape format header exists
            if ! head -n1 cookies.txt | grep -q "# Netscape"; then
              echo "# Netscape HTTP Cookie File" | cat - cookies.txt > temp && mv temp cookies.txt
            fi
            echo "cookies.txt created - size $(wc -c < cookies.txt) bytes"
            head -n 5 cookies.txt
          else
            echo "No cookies secret found - will try without cookies"
          fi
          ls -lh

      - name: Run HD Video Autoposter
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_GROUP_ID: ${{ secrets.FB_GROUP_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          export DENO_INSTALL="$HOME/.deno"
          export PATH="$DENO_INSTALL/bin:$PATH"
          python movimoon-video-autoposter.py

      - name: Commit posted history
        run: |
          git config --global user.name 'MoviMoon Bot'
          git config --global user.email 'bot@movimoon.online'
          git add posted_history.json || echo "No history"
          git diff --staged --quiet || git commit -m "Update posted history FIXED [skip ci]"
          git push || echo "No changes"
