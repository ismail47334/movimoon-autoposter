name: MoviMoon Video AutoPoster - HD 1MIN FIXED

on:
  schedule:
    - cron: '0 4 * * *'
    - cron: '0 9 * * *'
    - cron: '0 14 * * *'
  workflow_dispatch:

jobs:
  post-videos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg + Deno + NodeJS + yt-dlp POToken
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          # Install Deno - Required for PO Token bypass
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> $GITHUB_PATH
          export DENO_INSTALL="$HOME/.deno"
          export PATH="$DENO_INSTALL/bin:$PATH"
          $HOME/.deno/bin/deno --version
          # Install NodeJS for fallback
          sudo apt-get install -y nodejs
          # Install yt-dlp with all extras including PO Token support
          pip install -r requirements.txt
          pip install -U "yt-dlp[default]" -U
          pip install -U bgutil -U
          yt-dlp --version
          # Test deno runtime
          echo "Testing Deno PO Token runtime..."
          yt-dlp --js-runtimes deno --extractor-args "youtube:player_client=android" --list-formats "https://www.youtube.com/watch?v=BaW_jenozKc" --no-playlist || echo "Test failed but continuing - will retry in script"

      - name: Create cookies.txt (Optional Fallback)
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          if [ -n "$YOUTUBE_COOKIES" ]; then
            echo "$YOUTUBE_COOKIES" > cookies.txt
            echo "cookies.txt created - size $(wc -c < cookies.txt) bytes - optional fallback"
          else
            echo "No cookies - PO Token method will be used (no cookies needed)"
          fi

      - name: Run HD Video Autoposter
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_GROUP_ID: ${{ secrets.FB_GROUP_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          export DENO_INSTALL="$HOME/.deno"
          export PATH="$DENO_INSTALL/bin:$PATH"
          python movimoon-video-autoposter.py

      - name: Commit posted history
        run: |
          git config --global user.name 'MoviMoon Bot'
          git config --global user.email 'bot@movimoon.online'
          git add posted_history.json || echo "No history"
          git diff --staged --quiet || git commit -m "Update posted history PO-TOKEN FIX [skip ci]"
          git push || echo "No changes"
