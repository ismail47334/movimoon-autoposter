name: MoviMoon Video AutoPoster V40.1 FIXED NO-COOKIE

on:
  schedule:
    - cron: '0 4 * * *'
    - cron: '0 9 * * *'
    - cron: '0 14 * * *'
  workflow_dispatch:

jobs:
  post-videos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg + Deno + yt-dlp
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-noto-core
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> $GITHUB_PATH
          export DENO_INSTALL="$HOME/.deno"
          export PATH="$DENO_INSTALL/bin:$PATH"
          $HOME/.deno/bin/deno --version
          pip install -r requirements.txt
          pip install -U "yt-dlp[default]"
          yt-dlp --version
          python -m pip show bgutil-ytdlp-pot-provider || true

      - name: Start BGUtil PO Token (optional, fallback to android if fails)
        run: |
          export DENO_INSTALL="$HOME/.deno"
          export PATH="$DENO_INSTALL/bin:$PATH"
          # Try 3 different launch methods - new versions changed CLI
          nohup python -m bgutil_ytdlp_pot_provider --host 127.0.0.1 --port 4416 > bgutil.log 2>&1 &
          sleep 2
          if ! curl -s http://127.0.0.1:4416/ping > /dev/null 2>&1; then
            pkill -f bgutil || true
            nohup python -m bgutil_ytdlp_pot_provider.server --host 127.0.0.1 --port 4416 > bgutil.log 2>&1 &
            sleep 2
          fi
          if ! curl -s http://127.0.0.1:4416/ping > /dev/null 2>&1; then
            pkill -f bgutil || true
            nohup bgutil-ytdlp-pot-provider --host 127.0.0.1 --port 4416 > bgutil.log 2>&1 &
            sleep 2
          fi
          cat bgutil.log || echo "no log yet - using android client fallback"
          curl -s http://127.0.0.1:4416/ping && echo "BGUtil OK" || echo "BGUtil not responding - V40 will use android client (NO COOKIE) - this is FINE"
          ps aux | grep bgutil || true
          echo $! > bgutil.pid || echo $$ > bgutil.pid

      - name: Create cookies.txt - LAST RESORT ONLY
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          if [ -n "$YOUTUBE_COOKIES" ] && [ $(printf "%s" "$YOUTUBE_COOKIES" | wc -c) -gt 500 ]; then
            printf "%s" "$YOUTUBE_COOKIES" > cookies.txt
            echo "cookies.txt loaded: $(wc -c < cookies.txt) bytes - LAST resort"
          else
            echo "No valid YOUTUBE_COOKIES - Using NO-COOKIE mode (android client) - RECOMMENDED"
            echo "# No cookies - no-cookie mode" > cookies.txt
          fi

      - name: Run V40.1 FIXED FB + YT Shorts
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_GROUP_ID: ${{ secrets.FB_GROUP_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
        run: |
          export DENO_INSTALL="$HOME/.deno"
          export PATH="$DENO_INSTALL/bin:$PATH"
          python -u movimoon-video-autoposter.py

      - name: Stop BGUtil Provider
        if: always()
        run: |
          cat bgutil.log || true
          kill $(cat bgutil.pid) 2>/dev/null || pkill -f bgutil || true

      - name: Commit posted history
        run: |
          git config --global user.name 'MoviMoon Bot'
          git config --global user.email 'bot@movimoon.online'
          git add posted_history.json || echo "No history"
          git diff --staged --quiet || git commit -m "Update history V40.1 FIXED [skip ci]"
          git push || echo "No changes"
