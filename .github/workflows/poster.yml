name: MoviMoon Auto Poster - 3 Times Daily

on:
  schedule:
    # বাংলাদেশ টাইমে ৩ বার: সকাল ১০টা, বিকাল ৩টা, রাত ৮টা
    - cron: '0 4 * * *'   # সকাল ১০টা BDT
    - cron: '0 9 * * *'   # বিকাল ৩টা BDT
    - cron: '0 14 * * *'  # রাত ৮টা BDT
  workflow_dispatch:

jobs:
  post-movies:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run auto poster
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python movimoon-poster.py
