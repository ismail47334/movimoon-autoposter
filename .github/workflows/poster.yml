name: MoviMoon V37 - LATEST FIXED - Nov 4 Researched

on:
  schedule:
    - cron: '0 4 * * *'
    - cron: '0 9 * * *'
    - cron: '0 14 * * *'
  workflow_dispatch:

jobs:
  post-videos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg + Node + yt-dlp + POT - V37 LATEST FIXED
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-noto-core
          curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
          sudo apt-get install -y nodejs
          node --version
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt --upgrade
          python -m pip install -U yt-dlp[default] --upgrade
          python -m pip install -U google-genai --upgrade
          python -m yt_dlp --version

      - name: Clean old cookies - Method1 NO COOKIE
        run: |
          rm -f cookies.txt youtube_oauth_token.json
          echo "# V37 LATEST FIXED NO COOKIE - tv_downgraded + android_vr + web_embedded + mweb" > cookies.txt
          ls -lh

      - name: Run MoviMoon V37 LATEST - Nov 4 Researched
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_GROUP_ID: ${{ secrets.FB_GROUP_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
          YOUTUBE_PROXY: ${{ secrets.YOUTUBE_PROXY }}
        run: |
          python -u movimoon-video-autoposter.py

      - name: Commit history
        if: always()
        run: |
          git config --global user.name 'MoviMoon Bot'
          git config --global user.email 'bot@movimoon.online'
          git add posted_history.json || true
          git diff --staged --quiet || git commit -m "Update history V37 LATEST FIXED Nov 4 [skip ci]" || true
          git push || true
