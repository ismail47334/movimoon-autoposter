
name: MoviMoon Movie Picks - V2 Image Watermark Icons CTA

on:
  schedule:
    - cron: '0 2 * * *'
    - cron: '0 8 * * *'
    - cron: '0 15 * * *'
  workflow_dispatch:

jobs:
  movie-picks-post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg + Fonts + Deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-noto-core fonts-noto-cjk
          pip install requests google-genai google-generativeai pillow
          ffmpeg -version | head -1

      - name: Run V2 Movie Picks AutoPoster
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_ACCESS_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: |
          ls -lh watermark.png || echo "watermark missing - will use text fallback"
          python -u auto_movie_picks.py

      - name: Commit picks history
        run: |
          git config --global user.name 'MoviMoon Picks Bot'
          git config --global user.email 'picks@movimoon.online'
          git add picks_history.json || echo "No history yet"
          git diff --staged --quiet || git commit -m "Update picks history V2 icons+watermark [skip ci]"
          git push || echo "No changes"
